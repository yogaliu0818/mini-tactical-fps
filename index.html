<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>戰術前線 — 迷你 FPS</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#111820; color:#f6f7f8; font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif; }
    #game { display:block; width:100%; height:100%; }
    #hud { position:fixed; inset:0; pointer-events:none; }
    .topbar { position:absolute; top:14px; left:14px; right:14px; display:flex; justify-content:space-between; gap:8px; }
    .group { display:flex; flex-wrap:wrap; gap:7px; }
    .pill { padding:8px 11px; border:1px solid #ffffff36; border-radius:8px; background:#111820d9; text-shadow:0 1px 2px #000; }
    #crosshair { position:absolute; top:50%; left:50%; width:12px; height:12px; transform:translate(-50%,-50%); border:2px solid #fff; border-radius:50%; box-shadow:0 0 4px #000; transition:width .08s,height .08s; }
    #message { position:absolute; top:59%; left:50%; transform:translateX(-50%); color:#ffe08a; font-weight:700; text-shadow:0 2px 4px #000; white-space:nowrap; }
    #damage { position:absolute; inset:0; opacity:0; background:radial-gradient(ellipse,transparent 42%,#c82b2b99); transition:opacity .15s; }
    #overlay { position:fixed; inset:0; display:grid; place-items:center; padding:16px; background:#050912c9; text-align:center; }
    #overlay.hidden { display:none; }
    .panel { width:min(94vw,500px); max-height:90vh; overflow:auto; padding:24px; border:1px solid #ffffff35; border-radius:16px; background:#101a29f5; box-shadow:0 20px 70px #0008; }
    .panel h1 { margin:0 0 8px; }
    .panel p { color:#c5d0dc; line-height:1.65; }
    button { margin:5px; padding:10px 15px; border:0; border-radius:8px; background:#e6a83f; color:#171717; font:inherit; font-weight:700; cursor:pointer; }
    button:hover { background:#ffc45b; }
    button.secondary { background:#34465b; color:#fff; }
    button.secondary:hover { background:#49617c; }
    button:disabled { opacity:.45; cursor:not-allowed; }
    .small { color:#97a8b8 !important; font-size:13px; }
    .shop-row { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:7px 0; padding:8px 10px; border:1px solid #ffffff20; border-radius:8px; text-align:left; }
    .shop-row button { flex-shrink:0; }
    @media(max-width:600px) { .topbar { flex-direction:column; } .group { gap:5px; } .pill { padding:6px 8px; font-size:13px; } }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="topbar">
      <div class="group">
        <div class="pill">回合 <strong id="round">1</strong></div>
        <div class="pill">敵人 <strong id="enemies">0</strong></div>
        <div class="pill">生命 <strong id="health">100</strong></div>
        <div class="pill">護甲 <strong id="armor">0</strong></div>
      </div>
      <div class="group">
        <div class="pill">武器 <strong id="weapon">步槍</strong> <span id="ammo">30 / 90</span></div>
        <div class="pill">金錢 <strong id="money">$0</strong></div>
        <div class="pill">分數 <strong id="score">0</strong></div>
      </div>
    </div>
    <div id="crosshair"></div>
    <div id="message"></div>
    <div id="damage"></div>
  </div>

  <div id="overlay">
    <section class="panel">
      <h1 id="title">戰術前線</h1>
      <div id="panelContent"></div>
      <div id="panelActions"></div>
    </section>
  </div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js";
    import { GLTFLoader } from "https://esm.sh/three@0.162.0/examples/jsm/loaders/GLTFLoader.js?bundle";

    const canvas = document.querySelector("#game");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
    renderer.autoClear=false;
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9caeb4);
    scene.fog = new THREE.Fog(0x9caeb4, 28, 68);
    const camera = new THREE.PerspectiveCamera(76, innerWidth / innerHeight, 0.1, 100);
    camera.rotation.order = "YXZ";
    scene.add(camera);
    const viewScene = new THREE.Scene();
    const viewCamera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.01, 10);
    viewScene.add(viewCamera);
    viewScene.add(new THREE.HemisphereLight(0xe8f5ff, 0x1b2228, 2.2));
    const viewLight = new THREE.DirectionalLight(0xffffff, 2.4);
    viewLight.position.set(-2,3,4);viewScene.add(viewLight);
    const weaponModel = new THREE.Group();
    viewCamera.add(weaponModel);
    weaponModel.scale.setScalar(.34);
    const weaponModels = {};
    const weaponParts = {knifePivot:null};
    const handsModel = new THREE.Group();
    weaponModel.add(handsModel);
    handsModel.scale.setScalar(1);
    let externalArmsModel=null;
    const weaponProfiles={
      rifle:{position:[.48,-.34,-.88],rotation:[0,Math.PI*.56,-.06],scale:.66},
      pistol:{position:[.52,-.34,-.9],rotation:[0,Math.PI*.56,-.04],scale:.64},
      knife:{position:[.44,-.3,-.9],rotation:[0,0,.08],scale:.88}
    };
    const handProfiles={
      rifle:{left:[.82,.2,-1.22],right:[.25,.05,-.84]},
      pistol:{left:[.74,.15,-1.18],right:[.25,.05,-.84]},
      knife:{left:[0,0,-.8],right:[.50,0,-1.08]}
    };
    const armsProfiles={
      rifle:{position:[.58,-.08,-1.05],rotation:[0,Math.PI,0]},
      pistol:{position:[.58,-.12,-1.05],rotation:[0,Math.PI,0]},
      knife:{position:[.5,-.06,-1.05],rotation:[0,Math.PI,0]}
    };
    function poseExternalArms(name){
      if(!externalArmsModel)return;
      const leftShoulder=externalArmsModel.getObjectByName("shoulder.l");
      if(leftShoulder)leftShoulder.position.set(0,name==="rifle"?1:-1.3,0);
      const pose=armsProfiles[name];
      externalArmsModel.position.set(...pose.position);
      externalArmsModel.rotation.set(...pose.rotation);
    }
    let leftHandModel,rightHandModel;
    const weaponAnim={
      phase:"ready",time:0,duration:0,pending:null,
      offsetX:0,offsetY:0,offsetZ:0,pitch:0,roll:0,spin:0
    };

    function createWeaponModel(){
      const dark=new THREE.MeshStandardMaterial({color:0x354049,roughness:.72,metalness:.35});
      const black=new THREE.MeshStandardMaterial({color:0x1b2024,roughness:.8});
      const gripMat=new THREE.MeshStandardMaterial({color:0x34302b,roughness:1});
      const bladeMat=new THREE.MeshStandardMaterial({color:0x9eaab0,roughness:.3,metalness:.8});
      const build=(name,parts)=>{
        const group=new THREE.Group();weaponModel.add(group);weaponModels[name]=group;
        const part=(geometry,material,position,rotation=[0,0,0])=>{
          const mesh=new THREE.Mesh(geometry,material);mesh.position.set(...position);mesh.rotation.set(...rotation);mesh.castShadow=true;group.add(mesh);return mesh;
        };
        parts(part);
        return group;
      };
      build("rifle",part=>{
        part(new THREE.BoxGeometry(.28,.22,.72),dark,[.28,-.2,-.42]);
        part(new THREE.BoxGeometry(.18,.16,.5),black,[.28,-.11,-1.0]);
        part(new THREE.CylinderGeometry(.045,.045,.62,8),black,[.28,-.2,-1.53],[Math.PI/2,0,0]);
        part(new THREE.BoxGeometry(.16,.32,.2),gripMat,[.28,-.42,-.2],[.22,0,0]);
        part(new THREE.BoxGeometry(.16,.34,.22),black,[.28,-.4,-.65],[.12,0,0]);
        part(new THREE.BoxGeometry(.12,.1,.32),dark,[.28,-.08,-.47]);
        part(new THREE.BoxGeometry(.18,.18,.5),gripMat,[.12,-.48,-.2],[0,.15,-.18]);
        part(new THREE.BoxGeometry(.18,.18,.5),gripMat,[.42,-.46,-.36],[0,-.12,.18]);
      });
      build("pistol",part=>{
        part(new THREE.BoxGeometry(.22,.18,.48),dark,[.3,-.22,-.48]);
        part(new THREE.CylinderGeometry(.035,.035,.4,8),black,[.3,-.2,-.9],[Math.PI/2,0,0]);
        part(new THREE.BoxGeometry(.14,.3,.16),gripMat,[.3,-.43,-.3],[.16,0,0]);
        part(new THREE.BoxGeometry(.2,.06,.16),black,[.3,-.1,-.52]);
        part(new THREE.BoxGeometry(.16,.16,.38),gripMat,[.18,-.48,-.18],[0,.15,-.18]);
      });
      build("knife",part=>{
        // 爪刀使用單片弧形刀刃，刀尖向上勾回握柄方向。
        const curve=new THREE.CatmullRomCurve3([
          new THREE.Vector3(.3,-.2,-.38),
          new THREE.Vector3(.3,-.18,-.7),
          new THREE.Vector3(.3,-.12,-1.02),
          new THREE.Vector3(.3,-.02,-1.18),
          new THREE.Vector3(.3,.12,-1.2),
          new THREE.Vector3(.3,.2,-1.05)
        ]);
        part(new THREE.TubeGeometry(curve,16,.055,6,false),bladeMat,[0,0,0]);
        part(new THREE.BoxGeometry(.2,.08,.12),dark,[.3,-.22,-.38]);
        part(new THREE.BoxGeometry(.13,.24,.16),gripMat,[.3,-.4,-.25],[.2,0,0]);
        part(new THREE.TorusGeometry(.11,.035,8,16),dark,[.3,-.38,.02],[0,0,0]);
        part(new THREE.BoxGeometry(.16,.16,.28),gripMat,[.18,-.46,-.12],[0,.15,-.2]);
      });
    }
    function createHandsModel(){
      const glove=new THREE.MeshStandardMaterial({color:0x263844,roughness:.82,metalness:.05});
      const gloveEdge=new THREE.MeshStandardMaterial({color:0x4f6872,roughness:.7,metalness:.12});
      const sleeve=new THREE.MeshStandardMaterial({color:0x151f27,roughness:1});
      const createHand=right=>{
        const group=new THREE.Group();handsModel.add(group);
        const forearm=new THREE.Mesh(new THREE.CapsuleGeometry(.055,.45,5,8),sleeve);
        forearm.position.set(right ? .5 : -.02,-.68,right ? -.18 : -.38);
        group.rotation.z=right ? .12 : -.42;
        forearm.rotation.z=right ? .14 : -.14;forearm.castShadow=true;group.add(forearm);
        const cuff=new THREE.Mesh(new THREE.CylinderGeometry(.075,.075,.11,8),gloveEdge);
        cuff.position.set(right ? .48 : -.02,-.40,right ? -.28 : -.48);
        cuff.rotation.z=Math.PI/2; cuff.castShadow=true;group.add(cuff);
        const palmPos=[right ? .42 : .1,right ? -.43 : -.42,right ? -.38 : -.55];
        const palm=new THREE.Mesh(new THREE.DodecahedronGeometry(.10,1),glove);
        palm.scale.set(.9,.7,1.15);
        palm.position.set(...palmPos);
        palm.rotation.z=right ? .08 : -.08;palm.castShadow=true;group.add(palm);
        const fingerGeo=new THREE.CapsuleGeometry(.022,.12,3,6);
        const fingerOffsets=[[-.045,.01,-.065],[-.02,.0,-.09],[.005,-.005,-.10],[.03,.0,-.09],[.055,.01,-.06]];
        for(const [ox,oy,oz] of fingerOffsets){
          const finger=new THREE.Mesh(fingerGeo,glove);
          finger.position.set(palmPos[0]+ox,palmPos[1]+oy-.035,palmPos[2]+oz);
          finger.rotation.x=Math.PI/2;finger.castShadow=true;group.add(finger);
        }
        const thumb=new THREE.Mesh(new THREE.CapsuleGeometry(.021,.09,3,6),gloveEdge);
        thumb.position.set(palmPos[0]+(right?.075:-.075),palmPos[1]-.015,palmPos[2]-.005);
        thumb.rotation.z=right?.55:-.55;thumb.castShadow=true;group.add(thumb);
        return group;
      };
      rightHandModel=createHand(true);leftHandModel=createHand(false);
    }
    function setWeaponModel(name){
      handsModel.visible=false;
      if(externalArmsModel)externalArmsModel.visible=false;
      for(const [key,model] of Object.entries(weaponModels)){
        model.visible=key===name;
        const pose=weaponProfiles[key];
        model.position.set(...pose.position);model.rotation.set(...pose.rotation);model.scale.setScalar(pose.scale);
      }
      const hands=handProfiles[name];
      leftHandModel.visible=name!=="knife";
      rightHandModel.visible=true;
      leftHandModel.position.set(...hands.left);
      rightHandModel.position.set(...hands.right);
      poseExternalArms(name);
    }
    const easeMotion=t=>t*t*(3-2*t);
    function beginWeaponEquip(name,initial=false){
      if(!weapons[name]||weaponAnim.phase!=="ready")return;
      if(!initial&&name===selectedWeapon)return;
      weaponAnim.phase="lower";weaponAnim.time=0;weaponAnim.pending=name;
      weaponAnim.offsetX=0;weaponAnim.offsetY=0;weaponAnim.offsetZ=0;weaponAnim.pitch=0;weaponAnim.roll=0;weaponAnim.spin=0;
      player.reloadTime=0;player.fireCooldown=0;player.weaponKick=0;player.weaponSwing=0;
      setMessage(initial?`${weapons[name].name} 裝備中…`:`切換至 ${weapons[name].name}…`,.8);
    }
    function updateWeaponAnimation(dt){
      if(weaponAnim.phase==="ready")return;
      weaponAnim.time+=dt;
      if(weaponAnim.phase==="lower"){
        const p=easeMotion(Math.min(1,weaponAnim.time/.13));
        weaponAnim.offsetX=.04*p;weaponAnim.offsetY=-.78*p;weaponAnim.offsetZ=.1*p;weaponAnim.roll=-.34*p;
        if(p>=1){
          selectedWeapon=weaponAnim.pending;setWeaponModel(selectedWeapon);
          weaponAnim.phase="raise";weaponAnim.time=0;
        }
      }else if(weaponAnim.phase==="raise"){
        const p=easeMotion(Math.min(1,weaponAnim.time/.18));
        weaponAnim.offsetX=.04*(1-p);weaponAnim.offsetY=-.78*(1-p);weaponAnim.offsetZ=.1*(1-p);weaponAnim.roll=-.34*(1-p);
        if(p>=1){weaponAnim.phase="action";weaponAnim.time=0;weaponAnim.duration=selectedWeapon==="knife"?.62:.3;setMessage(selectedWeapon==="knife"?"爪刀翻轉中…":"拉栓中…",weaponAnim.duration);}
      }else if(weaponAnim.phase==="action"){
        const p=Math.min(1,weaponAnim.time/weaponAnim.duration);
        if(selectedWeapon==="knife"){
          weaponAnim.spin=easeMotion(p)*Math.PI*2;
          if(weaponParts.knifePivot)weaponParts.knifePivot.rotation.z=weaponAnim.spin;
          weaponAnim.offsetZ=.08*Math.sin(Math.PI*p);
        }else{
          const rack=easeMotion(p<.5?p*2:(1-p)*2);
          // Current OBJ viewmodels are single meshes, so the rack is represented by a short, readable charging motion.
          weaponAnim.offsetX=-.075*rack;weaponAnim.offsetZ=.12*rack;weaponAnim.pitch=-.1*rack;
        }
        if(p>=1){weaponAnim.phase="ready";weaponAnim.time=0;weaponAnim.pending=null;weaponAnim.offsetX=0;weaponAnim.offsetY=0;weaponAnim.offsetZ=0;weaponAnim.pitch=0;weaponAnim.roll=0;weaponAnim.spin=0;if(weaponParts.knifePivot)weaponParts.knifePivot.rotation.z=0;setMessage("已就緒",.45);}
      }
      updateCamera();
    }
    createWeaponModel();
    createHandsModel();
    setWeaponModel("rifle");
    function loadExternalArms(){
      const loader=new GLTFLoader();
      loader.load("assets/arms.glb",gltf=>{
        const model=gltf.scene;
        const bounds=new THREE.Box3().setFromObject(model),size=bounds.getSize(new THREE.Vector3());
        const longest=Math.max(size.x,size.y,size.z);
        model.scale.setScalar(.28/Math.max(longest,.001));
        model.scale.x*=.55;
        externalArmsModel=model;
        poseExternalArms(selectedWeapon);
        for(const side of [".l",".r"]){
          for(const finger of ["pinky","ring","middle","index","thumb"]){
            for(let segment=1;segment<=3;segment++){
              const bone=model.getObjectByName(`finger_${finger}${segment}${side}`);
              if(bone)bone.rotation.x-=finger==="thumb" ? .35 : .8;
            }
          }
        }
        const gloveMaterial=new THREE.MeshStandardMaterial({color:0x1e3440,roughness:.78,metalness:.08});
        model.traverse(node=>{if(node.isMesh){node.castShadow=true;node.material=gloveMaterial;}});
        handsModel.visible=true;
        model.visible=false;
      },undefined,error=>console.warn("手臂模型載入失敗，使用簡化手套",error));
    }
    loadExternalArms();

    function loadExternalWeaponModels(){
      const assets={
        rifle:{path:"assets/rifle.glb",targetLength:1.05},
        pistol:{path:"assets/pistol.glb",targetLength:.68},
        knife:{path:"assets/karambit.glb",targetLength:.6}
      };
      const loader=new GLTFLoader();
      for(const [name,config] of Object.entries(assets)){
        loader.load(config.path,gltf=>{
          const object=gltf.scene,removeNodes=[];
          object.traverse(node=>{
            if(node.isMesh){
              node.castShadow=true;
              const materialName=node.material?.name||"";
              if(node.name==="Cube"||materialName.includes("Ground"))removeNodes.push(node);
            }
            if(node.isLight||node.isCamera)node.visible=false;
          });
          for(const node of removeNodes)node.parent?.remove(node);
          const bounds=new THREE.Box3().setFromObject(object),size=bounds.getSize(new THREE.Vector3());
          const length=Math.max(size.x,size.y,size.z);object.scale.setScalar(config.targetLength/Math.max(length,.001));
          object.position.set(0,0,0);object.rotation.set(0,0,0);
          weaponModels[name].clear();weaponModels[name].add(object);
          if(name==="knife"){
            weaponParts.knifePivot=object.getObjectByName("KarambitPivot")||null;
            if(weaponParts.knifePivot){
              object.position.set(-weaponParts.knifePivot.position.x*object.scale.x,-weaponParts.knifePivot.position.y*object.scale.y,-weaponParts.knifePivot.position.z*object.scale.z);
              weaponParts.knifePivot.rotation.z=0;
            }
          }
          setWeaponModel(selectedWeapon);
        },undefined,error=>console.warn(`無法載入${name} GLB 模型`,error));
      }
    }
    loadExternalWeaponModels();
    scene.add(new THREE.HemisphereLight(0xd8efff, 0x38413a, 2));
    const sun = new THREE.DirectionalLight(0xffe6bd, 2.2);
    sun.position.set(-12, 24, 10); sun.castShadow = true; sun.shadow.mapSize.set(1024,1024); scene.add(sun);

    const floor = new THREE.Mesh(new THREE.PlaneGeometry(60,60), new THREE.MeshStandardMaterial({color:0x596257,roughness:1}));
    floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);
    const grid = new THREE.GridHelper(60,30,0x56614f,0x68705d); grid.position.y=.015; scene.add(grid);

    const obstacleMeshes = [], obstacleBounds = [];
    function addBox(x,z,w,d,h,color=0x72766b) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,roughness:.9}));
      mesh.position.set(x,h/2,z); mesh.castShadow=true; mesh.receiveShadow=true; scene.add(mesh);
      obstacleMeshes.push(mesh); obstacleBounds.push({minX:x-w/2,maxX:x+w/2,minZ:z-d/2,maxZ:z+d/2});
    }
    addBox(0,0,8,1.4,1.4,0x77796c); addBox(-10,-7,2,8,2.7,0x686f69);
    addBox(10,-8,8,2,2.2,0x77796c); addBox(-7,10,7,2,1.8,0x77796c);
    addBox(9,8,2,7,2.5,0x686f69); addBox(-15,2,3,3,2.5,0x8a7559);
    addBox(15,-1,3,3,2.5,0x8a7559); addBox(1,-14,4,3,2,0x8a7559);

    const weapons = {
      rifle: { name:"步槍", magazine:30, ammo:30, reserve:90, damage:34, cooldown:.12, spread:.0038, reload:1.55, cost:0 },
      pistol: { name:"手槍", magazine:12, ammo:12, reserve:48, damage:52, cooldown:.28, spread:.002, reload:1.15, cost:0 },
      knife: { name:"爪刀", magazine:0, ammo:0, reserve:0, damage:85, cooldown:.55, spread:0, reload:0, cost:0 }
    };
    let selectedWeapon = "rifle";
    const player = { x:0,z:20,yaw:0,pitch:0,health:100,armor:0,reloadTime:0,fireCooldown:0,recoil:0,weaponKick:0,weaponSwing:0,money:0 };
    const keys = {}, enemies = [], effects = [];
    const raycaster = new THREE.Raycaster();
    let round=1, score=0, state="menu", lastTime=performance.now(), messageTimer=0, damageFlash=0;

    const $ = id => document.getElementById(id);
    const overlay=$("overlay"), titleEl=$("title"), panelContent=$("panelContent"), panelActions=$("panelActions");
    function currentGun(){ return weapons[selectedWeapon]; }
    function updateHud(){
      const gun=currentGun();
      $("round").textContent=round; $("enemies").textContent=enemies.length;
      $("health").textContent=Math.max(0,Math.ceil(player.health)); $("armor").textContent=Math.ceil(player.armor);
      $("weapon").textContent=gun.name; $("ammo").textContent=selectedWeapon==="knife"?"近戰":`${gun.ammo} / ${gun.reserve}`;
      $("money").textContent=`$${player.money}`; $("score").textContent=score;
    }
    function setMessage(text,time=1){ $("message").textContent=text; messageTimer=time; }
    function showPanel(title,content,actions){
      titleEl.textContent=title; panelContent.innerHTML=content; panelActions.replaceChildren();
      for(const item of actions){ const button=document.createElement("button"); button.textContent=item.label; if(item.secondary)button.className="secondary"; button.onclick=item.onClick; panelActions.append(button); }
      overlay.classList.remove("hidden");
    }
    function hidePanel(){ overlay.classList.add("hidden"); }
    function canStandAt(x,z,r=.7){
      if(Math.abs(x)>28||Math.abs(z)>28)return false;
      return !obstacleBounds.some(b=>x>b.minX-r&&x<b.maxX+r&&z>b.minZ-r&&z<b.maxZ+r);
    }
    function clearEffects(){ for(const e of effects){scene.remove(e.object);e.object.geometry?.dispose();e.object.material?.dispose();} effects.length=0; }
    function clearEnemies(){ for(const e of enemies)scene.remove(e.group); enemies.length=0; }

    function makeEnemy(x,z){
      const group=new THREE.Group();
      const body=new THREE.Mesh(new THREE.CapsuleGeometry(.38,.75,4,8),new THREE.MeshStandardMaterial({color:0x8d3c32,roughness:.85}));
      body.position.y=.88; body.castShadow=true; body.name="body"; group.add(body);
      const head=new THREE.Mesh(new THREE.SphereGeometry(.25,12,10),new THREE.MeshStandardMaterial({color:0xc98d68,roughness:.9}));
      head.position.y=1.55; head.castShadow=true; head.name="head"; group.add(head);
      const helmet=new THREE.Mesh(new THREE.SphereGeometry(.27,12,8,0,Math.PI*2,0,Math.PI/2),new THREE.MeshStandardMaterial({color:0x303a3d,roughness:.9}));
      helmet.position.y=1.65; helmet.castShadow=true; helmet.name="helmet"; group.add(helmet);
      const pack=new THREE.Mesh(new THREE.BoxGeometry(.45,.5,.2),new THREE.MeshStandardMaterial({color:0x303a3d}));
      pack.position.set(0,.95,.34); group.add(pack); group.position.set(x,0,z); scene.add(group);
      enemies.push({
        group, health:100, speed:THREE.MathUtils.randFloat(1,1.4),
        attack:THREE.MathUtils.randFloat(.5,1.5), strafe:Math.random()<.5?-1:1,
        state:"patrol", patrolAngle:Math.random()*Math.PI*2, lastKnown:null
      });
    }
    function loadoutReset(){
      for(const gun of Object.values(weapons)){gun.ammo=gun.magazine;gun.reserve=gun.name==="步槍"?90:48;}
      selectedWeapon="rifle";weaponAnim.phase="ready";weaponAnim.pending=null;setWeaponModel("rifle");beginWeaponEquip("rifle",true); player.x=0;player.z=20;player.yaw=0;player.pitch=0;player.health=100;player.armor=0;player.reloadTime=0;player.fireCooldown=0;player.recoil=0;player.weaponKick=0;player.weaponSwing=0;
    }
    function spawnRound(){
      clearEnemies();clearEffects();loadoutReset();
      const locations=[[-18,-16],[-7,-20],[8,-20],[19,-15],[18,5],[-19,8],[5,13],[-11,-2],[12,-3]];
      for(let i=0;i<Math.min(3+round,locations.length);i++)makeEnemy(...locations[i]);
      updateCamera();updateHud();
    }
    function updateCamera(){
      camera.position.set(player.x,1.65,player.z);camera.rotation.order="YXZ";camera.rotation.set(player.pitch,player.yaw,0);
      weaponModel.position.set(weaponAnim.offsetX,weaponAnim.offsetY,weaponAnim.offsetZ-(player.weaponKick||0));
      weaponModel.rotation.x=weaponAnim.pitch-(player.weaponKick||0)*.16;
      weaponModel.rotation.y=weaponParts.knifePivot?0:(selectedWeapon==="knife"?weaponAnim.spin:0);
      weaponModel.rotation.z=weaponAnim.roll+(weaponParts.knifePivot?0:(selectedWeapon==="knife"?weaponAnim.spin:0))+(player.weaponSwing||0);
      camera.updateMatrixWorld(true);
    }

    function startMatch(){ round=1;score=0;player.money=100;spawnRound();state="running";hidePanel();canvas.requestPointerLock(); }
    function pauseGame(){ if(state!=="running")return;state="paused";showPanel("遊戲暫停","按下繼續返回戰場。",[{label:"繼續遊戲",onClick:resumeGame}]); }
    function resumeGame(){state="running";hidePanel();canvas.requestPointerLock();}
    function openShop(){
      state="shop"; if(document.pointerLockElement)document.exitPointerLock();
      player.money+=50+round*25;
      const content=`<p>第 ${round} 回合完成！獲得獎勵。金錢：<strong>$${player.money}</strong></p>
        <div class="shop-row"><span>護甲 +50　($60)</span><button data-buy="armor">購買</button></div>
        <div class="shop-row"><span>補滿備用彈藥　($35)</span><button data-buy="ammo">購買</button></div>
        <div class="shop-row"><span>步槍傷害 +8　($100)</span><button data-buy="rifle">升級</button></div>
        <div class="shop-row"><span>手槍傷害 +12　($80)</span><button data-buy="pistol">升級</button></div>
        <p class="small">選擇武器：1 步槍、2 手槍。移動和連續射擊會增加散佈。</p>`;
      showPanel("回合商店",content,[{label:"開始下一回合",onClick:nextRound}]);
      // 事件委派避免商店重新建立 DOM 後，購買按鈕遺失監聽器。
      panelContent.onclick=e=>{
        const button=e.target.closest("[data-buy]");
        if(button)buy(button.dataset.buy);
      };
      refreshShopButtons();
      updateHud();
    }
    function refreshShopButtons(){
      const prices={armor:60,ammo:35,rifle:100,pistol:80};
      panelContent.querySelectorAll("[data-buy]").forEach(button=>{
        button.disabled=player.money<prices[button.dataset.buy];
      });
    }
    function buy(type){
      const prices={armor:60,ammo:35,rifle:100,pistol:80};const price=prices[type];
      if(player.money<price){setMessage("金錢不足");return;}
      player.money-=price;
      if(type==="armor")player.armor=Math.min(100,player.armor+50);
      if(type==="ammo"){weapons.rifle.reserve+=60;weapons.pistol.reserve+=24;}
      if(type==="rifle")weapons.rifle.damage+=8;
      if(type==="pistol")weapons.pistol.damage+=12;
      refreshShopButtons();
      updateHud();
    }
    function nextRound(){round++;spawnRound();state="running";hidePanel();canvas.requestPointerLock();}
    function gameOver(){state="gameover";if(document.pointerLockElement)document.exitPointerLock();showPanel("任務失敗",`你在第 ${round} 回合被擊敗。最終分數：${score}。`,[{label:"重新開始",onClick:startMatch}]);}

    document.addEventListener("pointerlockchange",()=>{if(document.pointerLockElement!==canvas&&state==="running")pauseGame();});
    document.addEventListener("mousemove",e=>{if(document.pointerLockElement!==canvas||state!=="running")return;player.yaw-=e.movementX*.002;player.pitch=THREE.MathUtils.clamp(player.pitch-e.movementY*.002,-1.35,1.35);});
    document.addEventListener("keydown",e=>{
      keys[e.code]=true;
      if(e.code==="KeyR")reload();
      if(e.code==="Digit1")selectWeapon("rifle");
      if(e.code==="Digit2")selectWeapon("pistol");
      if(e.code==="Digit3")selectWeapon("knife");
      if(e.code==="KeyB"&&state==="running")pauseGame();
    });
    document.addEventListener("keyup",e=>keys[e.code]=false);
    canvas.addEventListener("click",()=>{if(state==="running"&&document.pointerLockElement!==canvas)canvas.requestPointerLock();});
    document.addEventListener("mousedown",e=>{if(e.button===0)shoot();});
    function selectWeapon(name){if(state!=="running"||!weapons[name]||weaponAnim.phase!=="ready"||name===selectedWeapon)return;beginWeaponEquip(name);updateHud();}

    function reload(){
      const gun=currentGun();if(state!=="running"||weaponAnim.phase!=="ready"||selectedWeapon==="knife"||player.reloadTime>0||gun.ammo>=gun.magazine||gun.reserve<=0)return;
      player.reloadTime=gun.reload;setMessage("裝填中…",gun.reload);
    }
    function addTracer(start,end){
      const geometry=new THREE.BufferGeometry().setFromPoints([start,end]);
      const material=new THREE.LineBasicMaterial({color:0xffe6a3,transparent:true,opacity:1,depthTest:true});
      const line=new THREE.Line(geometry,material);line.renderOrder=5;scene.add(line);effects.push({object:line,life:.13,duration:.13});
    }
    function addImpact(point,color=0xffbb55){
      const material=new THREE.MeshBasicMaterial({color,transparent:true,opacity:1,depthTest:true});
      const spark=new THREE.Mesh(new THREE.SphereGeometry(.09,8,8),material);spark.position.copy(point);scene.add(spark);effects.push({object:spark,life:.2,duration:.2});
    }
    function knifeAttack(){
      const gun=weapons.knife;player.fireCooldown=gun.cooldown;player.weaponKick=.12;player.weaponSwing=-.48;
      updateCamera();raycaster.setFromCamera(new THREE.Vector2(0,0),camera);raycaster.far=2.8;
      const hits=raycaster.intersectObjects(enemies.map(e=>e.group),true);
      if(!hits.length){setMessage("揮砍落空",.35);return;}
      const hit=hits[0];let node=hit.object,hitEnemy=null;
      while(node&&!hitEnemy){hitEnemy=enemies.find(enemy=>enemy.group===node);node=node.parent;}
      if(!hitEnemy)return;
      const headshot=hit.object.name==="head";hitEnemy.health-=headshot?gun.damage*1.5:gun.damage;
      addImpact(hit.point,0xffd27a);setMessage(headshot?"爪刀爆頭！":"爪刀命中",.5);
      if(hitEnemy.health<=0){scene.remove(hitEnemy.group);enemies.splice(enemies.indexOf(hitEnemy),1);score+=headshot?180:120;player.money+=15;setMessage("爪刀擊殺！ +$15",1);}
      updateHud();if(enemies.length===0)openShop();
    }
    function shoot(){
      if(state!=="running"||document.pointerLockElement!==canvas)return;
      const gun=currentGun();if(weaponAnim.phase!=="ready"||player.reloadTime>0||player.fireCooldown>0)return;
      if(selectedWeapon==="knife"){knifeAttack();return;}
      if(gun.ammo<=0){reload();return;}
      gun.ammo--;player.fireCooldown=gun.cooldown;player.recoil=Math.min(player.recoil+1,7);
      player.weaponKick=.06;player.weaponSwing=selectedWeapon==="pistol"?-.035:-.02;
      const moving=keys.KeyW||keys.KeyA||keys.KeyS||keys.KeyD;
      const spread=gun.spread+(moving?.009:0)+player.recoil*.0012;
      updateCamera();
      const aim=new THREE.Vector2(THREE.MathUtils.randFloatSpread(spread),THREE.MathUtils.randFloatSpread(spread));
      raycaster.setFromCamera(aim,camera);raycaster.far=45;
      const hits=raycaster.intersectObjects([...obstacleMeshes,...enemies.map(e=>e.group)],true);
      const direction=new THREE.Vector3();camera.getWorldDirection(direction);
      const right=new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion);
      const up=new THREE.Vector3(0,1,0).applyQuaternion(camera.quaternion);
      const muzzle=camera.position.clone().addScaledVector(direction,.4).addScaledVector(right,.15).addScaledVector(up,-.12);
      const end=hits.length?hits[0].point.clone():camera.position.clone().addScaledVector(direction,45);
      addTracer(muzzle,end);
      if(hits.length){
        const hit=hits[0];let node=hit.object,hitEnemy=null;
        while(node&&!hitEnemy){hitEnemy=enemies.find(enemy=>enemy.group===node);node=node.parent;}
        if(hitEnemy){const headshot=hit.object.name==="head";hitEnemy.health-=headshot?gun.damage*2:gun.damage;addImpact(hit.point,0xff6655);setMessage(headshot?"爆頭！":"命中",.65);
          if(hitEnemy.health<=0){scene.remove(hitEnemy.group);enemies.splice(enemies.indexOf(hitEnemy),1);score+=headshot?150:100;player.money+=15;setMessage(headshot?"爆頭擊殺！ +$15":"擊殺！ +$15",1);}
        }else{addImpact(hit.point);setMessage("",.1);}
      }else setMessage("",.1);
      // Three.js 相機的正 X 俯仰是向上，射擊後用小幅度後座力抬槍。
      player.pitch=THREE.MathUtils.clamp(player.pitch+.009,-1.35,1.35);
      updateHud();
      if(enemies.length===0)openShop();
    }
    function hasLineOfSight(from,to){
      const origin=new THREE.Vector3(from.x,1.3,from.z),target=new THREE.Vector3(to.x,1.2,to.z);
      const direction=target.clone().sub(origin),distance=direction.length();direction.normalize();raycaster.set(origin,direction);raycaster.far=distance;
      return raycaster.intersectObjects(obstacleMeshes,false).length===0;
    }
    function updatePlayer(dt){
      const fx=-Math.sin(player.yaw),fz=-Math.cos(player.yaw),rx=Math.cos(player.yaw),rz=-Math.sin(player.yaw);
      let mx=0,mz=0;if(keys.KeyW){mx+=fx;mz+=fz;}if(keys.KeyS){mx-=fx;mz-=fz;}if(keys.KeyD){mx+=rx;mz+=rz;}if(keys.KeyA){mx-=rx;mz-=rz;}
      const length=Math.hypot(mx,mz);if(length){const speed=keys.ShiftLeft||keys.ShiftRight?7.2:4.7;mx=mx/length*speed*dt;mz=mz/length*speed*dt;if(canStandAt(player.x+mx,player.z))player.x+=mx;if(canStandAt(player.x,player.z+mz))player.z+=mz;}
      player.recoil=Math.max(0,player.recoil-dt*3.4);updateCamera();
      $("crosshair").style.width=$("crosshair").style.height=`${12+(length?9:0)+player.recoil*1.1}px`;
    }
    function updateEnemies(dt){
      for(const enemy of [...enemies]){
        const dx=player.x-enemy.group.position.x,dz=player.z-enemy.group.position.z,distance=Math.hypot(dx,dz);
        enemy.group.lookAt(player.x,enemy.group.position.y+1,player.z);
        const visible=distance<27&&hasLineOfSight(enemy.group.position,player);
        if(visible){
          const wasAware=enemy.state==="chase"||enemy.state==="attack";
          if(!wasAware)setMessage("敵人發現你！",.7);
          enemy.state=distance<12?"attack":"chase";
          enemy.lastKnown={x:player.x,z:player.z};
        }else if(enemy.state!=="patrol"&&enemy.lastKnown){
          enemy.state="search";
        }
        if(enemy.state==="patrol"){
          enemy.patrolAngle+=dt*.45*enemy.strafe;
          const px=enemy.group.position.x+Math.cos(enemy.patrolAngle)*enemy.speed*.35*dt;
          const pz=enemy.group.position.z+Math.sin(enemy.patrolAngle)*enemy.speed*.35*dt;
          if(canStandAt(px,pz,.4)){enemy.group.position.x=px;enemy.group.position.z=pz;}
        }else if(enemy.state==="search"&&enemy.lastKnown){
          const sx=enemy.lastKnown.x-enemy.group.position.x,sz=enemy.lastKnown.z-enemy.group.position.z;
          const sd=Math.hypot(sx,sz);
          if(sd<.7){enemy.state="patrol";enemy.lastKnown=null;}
          else {const step=enemy.speed*dt*.8;if(canStandAt(enemy.group.position.x+sx/sd*step,enemy.group.position.z,.4))enemy.group.position.x+=sx/sd*step;if(canStandAt(enemy.group.position.x,enemy.group.position.z+sz/sd*step,.4))enemy.group.position.z+=sz/sd*step;}
        }else if(enemy.state==="chase"||enemy.state==="attack"){
          if(distance>8){const nx=dx/Math.max(distance,.001),nz=dz/Math.max(distance,.001),step=enemy.speed*dt;
            if(canStandAt(enemy.group.position.x+nx*step,enemy.group.position.z,.4))enemy.group.position.x+=nx*step;
            if(canStandAt(enemy.group.position.x,enemy.group.position.z+nz*step,.4))enemy.group.position.z+=nz*step;
          }else if(distance>4){const nx=Math.cos(performance.now()*.001*enemy.strafe)*dt*.5;if(canStandAt(enemy.group.position.x+nx,enemy.group.position.z,.4))enemy.group.position.x+=nx;}
        }
        enemy.attack-=dt;
        if(visible&&enemy.attack<=0){
          enemy.attack=THREE.MathUtils.randFloat(1.1,1.8);
          if(Math.random()<(distance<12?.42:.22)){
            let damage=THREE.MathUtils.randInt(6,12);const absorbed=Math.min(player.armor,damage*.65);player.armor-=absorbed;player.health-=damage-absorbed;
            damageFlash=.22;updateHud();setMessage("你受到攻擊！",.7);if(player.health<=0){player.health=0;updateHud();gameOver();return;}
          }
        }
      }
      updateHud();
    }
    function update(dt){
      if(messageTimer>0){messageTimer-=dt;if(messageTimer<=0)$("message").textContent="";}
      player.weaponKick=THREE.MathUtils.lerp(player.weaponKick||0,0,Math.min(1,dt*14));
      player.weaponSwing=THREE.MathUtils.lerp(player.weaponSwing||0,0,Math.min(1,dt*12));
      updateWeaponAnimation(dt);
      damageFlash=Math.max(0,damageFlash-dt);$("damage").style.opacity=damageFlash>0?String(damageFlash/.22):"0";
      for(let i=effects.length-1;i>=0;i--){const e=effects[i];e.life-=dt;e.object.material.opacity=Math.max(0,e.life/e.duration);if(e.life<=0){scene.remove(e.object);e.object.geometry.dispose();e.object.material.dispose();effects.splice(i,1);}}
      if(state!=="running")return;
      player.fireCooldown=Math.max(0,player.fireCooldown-dt);
      if(player.reloadTime>0){player.reloadTime-=dt;if(player.reloadTime<=0){const gun=currentGun(),amount=Math.min(gun.magazine-gun.ammo,gun.reserve);gun.ammo+=amount;gun.reserve-=amount;setMessage("裝填完成",.7);updateHud();}}
      updatePlayer(dt);updateEnemies(dt);
    }
    function animate(now){
      const dt=Math.min((now-lastTime)/1000,.05);lastTime=now;update(dt);
      renderer.clear();
      renderer.render(scene,camera);
      renderer.clearDepth();
      renderer.render(viewScene,viewCamera);
      requestAnimationFrame(animate);
    }
    window.addEventListener("resize",()=>{
      const aspect=innerWidth/innerHeight;
      camera.aspect=aspect;camera.updateProjectionMatrix();
      viewCamera.aspect=aspect;viewCamera.updateProjectionMatrix();
      renderer.setSize(innerWidth,innerHeight);
    });

    showPanel("戰術前線",`<p>原創迷你戰術射擊遊戲。利用掩體、瞄準敵人，逐回合生存並升級武器。</p><p><strong>WASD</strong> 移動　<strong>滑鼠</strong> 瞄準<br><strong>左鍵</strong> 射擊　<strong>R</strong> 裝填　<strong>Shift</strong> 衝刺<br><strong>1 / 2 / 3</strong> 步槍／手槍／爪刀　<strong>B</strong> 暫停</p><p class="small">射擊採即時命中判定，爪刀為近戰攻擊。需要網路載入 Three.js。</p>`,[{label:"開始遊戲",onClick:startMatch}]);
    updateHud();requestAnimationFrame(animate);
  </script>
</body>
</html>
